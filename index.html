  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello! 🌸</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ANIMATED CURSOR */

    @media (pointer: fine) {
      *, *::before, *::after {
        cursor: none !important; 
      }

      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px; 
        height: 300px; 
        pointer-events: none; 
        z-index: 99999;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        will-change: transform;
        transform: translate3d(-50%, -50%, 0);
      }
    }

     @media (pointer: coarse) {
      #cursor {
        display: none !important;
      }
    }

    /* EXISTING STYLES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', 'Georgia', serif;
      background-color: #050b14;
      color: #fff;
    }

    body {
      background-image: url('pinkf2.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* CANVAS BACKGROUND */
    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HOLDS HEADER AND RECENTAGLE TOGETHER */
    .center-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER TEXT ON TOP OF PINK RECTNANGLE */
    .header {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 
        0 0 10px rgba(226, 241, 255, 0.8),
        0 0 20px rgba(138, 43, 226, 0.6),
        0 0 40px rgba(255, 105, 180, 0.4);
      pointer-events: none;
      margin-bottom: 18px; 
    }

    /* GLOWING PINK RECTANGLE DOOR */
    .pink-rectangle {
      width: 280px;
      height: 65vh; 
      max-height: 500px;
      
      border-radius: 12px;
      background: rgba(255, 20, 147, 0.08);
      border: 2px solid rgba(255, 105, 180, 0.8);
      backdrop-filter: blur(3px);
      box-shadow: 
        0 0 15px rgba(255, 105, 180, 0.6),
        0 0 30px rgba(255, 20, 147, 0.4),
        0 0 60px rgba(255, 20, 147, 0.2),
        inset 0 0 20px rgba(255, 105, 180, 0.4);
      animation: pulseGlow 2s ease-in-out infinite alternate;
      
      overflow-y: auto; 
      padding: 20px;

      /* TEXT AND SPACING INSIDE RECTANGLE */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.6;
    }

    /* STLYING TEXT INSIDE RECTANGLE*/
    .pink-rectangle p {
      margin-bottom: 15px;
      font-size: 1.5rem;
      color: ##ffffff;
	text-shadow: 2px 2px 4px #000000;
    }

    /* STYLING LINKS INSIDE RECTANGLE */
    .pink-rectangle a {
      display: inline-block;
      color: #ffadba;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
     text-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
    }

    /* LINK HOVER EFFECT */
    .pink-rectangle a:hover {
      color: #ffffff;
      text-shadow: 
        0 0 8px #fff,
        0 0 15px #ff69b4,
        0 0 25px #ff1493;
      transform: scale(1.05);
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 
          0 0 15px rgba(255, 105, 180, 0.6),
          0 0 30px rgba(255, 20, 147, 0.4),
          0 0 60px rgba(255, 20, 147, 0.2),
          inset 0 0 20px rgba(255, 105, 180, 0.4);
        border-color: rgba(255, 105, 180, 0.8);
      }
      100% {
        box-shadow: 
          0 0 25px rgba(255, 105, 180, 0.9),
          0 0 50px rgba(255, 20, 147, 0.7),
          0 0 90px rgba(255, 20, 147, 0.4),
          inset 0 0 35px rgba(255, 105, 180, 0.6);
        border-color: rgba(255, 192, 203, 1);
      }
    }

<body>

  <canvas id="bgCanvas"></canvas>
  <div class="fog"></div>

  <div class="center-wrapper">
    <h1 class="header">sehartist</h1>
    
    <div class="pink-rectangle">
      <p>
        Check out my<br>

      <p>------</p>
      <p>
        Explore my<br>

      </p>
    </div>

  <!-- Custom Animated Cursor Element -->
  <div id="cursor"></div>

  <script>

    // ANIMATED CURSOR MATHS

    if (window.matchMedia('(pointer: fine)').matches) {
      const TOTAL_FRAMES = 19;
      const FRAME_SPEED_MS = 60; // Lower = faster animation speed
      const cursor = document.getElementById('cursor');

  
      const frameUrls = [];
      for (let i = 1; i <= TOTAL_FRAMES; i++) {
        const img = new Image();
        const src = `${i}.png`; 
        img.src = src;
        frameUrls.push(src);
      }


      let currentFrame = 0;
      setInterval(() => {
        cursor.style.backgroundImage = `url("${frameUrls[currentFrame]}")`;
        currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      }, FRAME_SPEED_MS);

      let mouseX = -100;
      let mouseY = -100;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function renderCursor() {
        cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        requestAnimationFrame(renderCursor);
      }

      requestAnimationFrame(renderCursor);
    }

    // PINK SAKURA LEAVES CANVAS FALLING ANIMATION

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Leaf {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 8 + 6;
        this.speedY = Math.random() * 1.5 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.03;
        this.oscillation = Math.random() * 0.02 + 0.01;
        this.opacity = Math.random() * 0.5 + 0.4;
        
        const colors = [
          '#ffb6c1',
          '#ff69b4',
          '#ff1493',
          '#ffc0cb'
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * this.oscillation) + this.speedX;
        this.angle += this.spin;

        if (this.y > height + 20) {
          this.reset();
          this.y = -10;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.quadraticCurveTo(this.size, 0, 0, this.size);
        ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
        ctx.fill();

        ctx.restore();
      }
    }

    const leaves = Array.from({ length: 45 }, () => new Leaf());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      leaves.forEach(leaf => {
        leaf.update();
        leaf.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
